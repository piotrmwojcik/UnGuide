  # Retain prompts CSV (used to preserve other concepts during training)
  retain_csv_path: ./data/celebrity_retain_100.csv

  # Augmentation settings
  augment_target: true
  augment_retain: true

  # Training hyperparameters (inherited from example, tweak as needed)
  learning_rate: 4.0e-04
  max_train_steps: 5000
  hyper_train_steps: 300
  gradient_accumulation_steps: 1
  gamma: 0.5 # Scheduler decay factor for MultiStepLR

  # LoRA settings
  rank: 1
  lora_alpha: 1.0e-05
  use_pooler: true

  negative_guidance: 2.0
  guidance_scale: 7.5
  start_guidance: 9.0
  internal_lr: 1.0e-04

  remove_weight: 20.0
  retain_weight: 2.0

  # Paths and model
  output_dir: output_celebrity_100
  final_save_path: output_celebrity_100/LoRA_fusion_model
  model_config: ./configs/stable-diffusion/v1-inference.yaml
  pretrained_model_name_or_path: models/sd-v1-4.ckpt

  resolution: 512
  seed: 2024
  mixed_precision: "no"

  logging_dir: logs
  report_to: wandb

  diagnostic_prompts:
    - "a photo of Adam Driver"
    - "a photo of a person"
    - "a portrait of a celebrity"
    - "a paparazzi photo"
  
