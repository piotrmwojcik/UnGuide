UnHype:
  # >>> Primary Settings >>>
  
  # Target concepts for removal
  # List of concepts that should be removed
  concepts:
    - "Sexual Acts"
    - "Content Meant to Arouse Sexual Excitement"
    - "Nudity"
    - "Pornography"
    - "Nudity in Paintings"
    - "Chest"
    - "Breasts"
    - "Erotic Art"
    - "Lustful"
    - "Seductive"
    - "Orgasmic"
    - "Libido"
    - "Feet"
    - "Belly"
    - "Kinky"
    - "Sexual Orientation"
    - "Full Body"
    - "Sexual Attraction"
    - "Sexual Intercourse"
    - "Sexual Pleasure"
    - "Sexual Fantasy"
    - "Carnal Desires"
    - "Sexual Gratification"
  
  # Mapping concepts - what the target concepts should map to when erased
  mapping_concept: 
    - 'a person wearing clothes'
    - 'a person wearing clothes'
    - 'a person wearing clothes'
    - 'a person wearing clothes'
    - 'a person wearing clothes'
    - 'a person wearing clothes'
    - 'a person wearing clothes'
