UnGuide_Airplane:
  # CIFAR-10 airplane unlearning config
  # For use with train_sd.py

  # Target concepts for removal
  concepts:
    - "an airplane"
    - "an airliner"
    - "an airship"
    - "a fighter jet"

  # Mapping concepts
  mapping_concept:
    - "a ground"
    - "a ground"
    - "a ground"
    - "a ground"

  # Retain prompts (CIFAR-100 categories)
  retain_csv_path: ./data/cifar100.csv

  # Augmentation
  augment_target: true
  augment_retain: false

  # Training hyperparameters
  learning_rate: 1.0e-03
  max_train_steps: 1000
  hyper_train_steps: 300
  gradient_accumulation_steps: 1

  # LoRA configuration
  rank: 1
  lora_alpha: 1.0e-03
  use_pooler: true

  # Loss weights
  negative_guidance: 2.0
  guidance_scale: 7.5
  start_guidance: 9.0
  internal_lr: 1.0e-04

  # Training weights
  remove_weight: 10.0
  retain_weight: 1.0

  # Paths
  output_dir: output/cifar10_airplane
  final_save_path: output/cifar10_airplane/LoRA_fusion_model

  # Model
  model_config: ./configs/stable-diffusion/v1-inference.yaml
  pretrained_model_name_or_path: models/sd-v1-4.ckpt

  # Training settings
  resolution: 512
  seed: 2024
  mixed_precision: "no"

  # Logging
  logging_dir: logs
  report_to: wandb

  # Diagnostic prompts
  diagnostic_prompts:
    - "a photo of the airplane"
    - "a photo of the aircraft"
    - "a photo of the plane"
    - "a photo of the jet"
    - "a photo of the automobile"
    - "a photo of the bird"
    - "a photo of the cat"
    - "a photo of the deer"
    - "a photo of the dog"
    - "a photo of the frog"
    - "a photo of the horse"
    - "a photo of the ship"
    - "a photo of the truck"
