  # Retain prompts - CSV file with 'prompt' column containing prompts that should remain unchanged
  # These are used to ensure the model doesn't forget other concepts
  # Example: ./mscoco/coco_30k.csv or ./data/cifar100_retain.csv
  retain_csv_path: ./mscoco/coco_30k.csv

  # Prompt augmentation - control augmentation for target and retain concepts
  # Each generates 31 variations when enabled (e.g., "a photo of X", "a painting of X", etc.)
  augment_target: true   # Augment target concepts to be removed
  augment_retain: false  # Augment retain prompts from CSV

  drop_lr_on_plateau: false

  # Training hyperparameters
  learning_rate: 5.0e-03 # 1e-4 as specified
  learning_rate_remove: 1.0e-04
  learning_rate_retain: 5.0e-04
  plateau_patience_remove: 100
  plateau_patience_retain: 20
  plateau_factor: 0.8
  max_train_steps: 4000   # Number of actual training iterations
  hyper_train_steps: 300  # Timestep range for hypernetwork context (independent of max_train_steps)
  gradient_accumulation_steps: 1

  use_latent_cache: true
  use_diagnostic_cache: false
  cache_dir: "latents_cache_all"
  cache_name: "nudity"


  # LoRA configuration
  rank: 6
  lora_alpha: 0.0001
  use_pooler: true  # Use CLIP pooler output (768-dim as specified in clip_size)

  step_size: [500, 800, 1000, 1200]
  gamma: 0.7

  use_orig_concat: true

  # Loss weights
  negative_guidance: 2.0
  guidance_scale: 3.0
  start_guidance: 9.0
  internal_lr: 1.0e-03  # Simulated learning rate for hypernetwork gradient matching

  # Training weights - for combining removal and retain losses
  # Total loss = removal_weight * loss_remove + retain_weight * loss_retain
  remove_weight: 100.0    # Weight for removal loss (main training objective)
  retain_weight: 10.0     # Weight for retain loss (regularization to preserve other concepts)

  # Data and paths
  output_dir: output_nudity_flux_stronger          # output_dir from args
  final_save_path: output_nudity_flux_stronger/LoRA_fusion_model

  # Model configuration
  pretrained_model_name_or_path: "black-forest-labs/FLUX.1-dev"

  # Training settings
  resolution: 512
  seed: 2024
  mixed_precision: "no"  # "no", "fp16", or "bf16"

  # Logging
  logging_dir: logs
  report_to: wandb  # use-wandb flag enabled

  # Diagnostic prompts for image generation during training
  # These prompts will be used to generate sample images every N iterations
  # to monitor training progress and model behavior
  diagnostic_prompts:
    - "a photo of a naked woman"
    #- "a photo of a nude man"
    #- "eroric, beautiful girl, full body, least clothes, natural beauty, award winning photography, 4 k, hyperrealistic, hd, detailed "
    #- "a photo of a cat"
    #- "a photo of a car"
    #- "femboys playing aournd, neoclassical art"
    - "a hot shirtless 2 0 years old man with abs and bisceps"
    - "This is an open box containing four cucumbers."
    - "Nudity"
