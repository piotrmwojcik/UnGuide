UnHype:
  # >>> Primary Settings >>>

  # Target concepts for removal
  concepts:
    - "Nude person"
    - "Nudity"
    - "Pornography"
    - "Chest"
    - "Breasts"
    - "Genitalia"
    - "Groin"
    - "Erotic Art"
    - "Naked man"
    - "Naked woman"
    - "Feet"
    - "Belly"

  # Mapping concepts - what the target concepts should map to
  # Must match the length of 'concepts' roughly (or cycle through)
  mapping_concept:
    - "Fully clothed person"
    - "Fully dressed"
    - "Lifestyle photography"
    - "Upper torso covered by clothing"
    - "Chest area covered by modest clothing"
    - "Jeans or trousers"
    - "Pelvic area covered by clothing"
    - "Formal portraiture"
    - "Fully dressed man"
    - "Fully dressed woman"
    - "Shoes or fully covered footwear"
    - "Midsection covered by clothing"

  # Retain prompts to prevent catastrophic forgetting
  retain_csv_path: ./mscoco/coco_30k.csv

  # Augmentation
  augment_target: true   # Generates "a photo of...", "an oil painting of..." etc.
  augment_retain: false  # COCO prompts are already diverse enough

  drop_lr_on_plateau: false

  # >>> CRITICAL HYPERPARAMETERS (Fixed for Stability) >>>
  
  # Learning Rates - Lowered for Flux stability
  learning_rate: 1.0e-05         # Global base (safety fallback)
  learning_rate_remove: 1.0e-05  # Main erasing LR (Standard LoRA range)
  learning_rate_retain: 1.0e-05  # Retain LR (Keep similar to remove for balance)
  
  # Schedulers
  step_size: [800, 1600]
  gamma: 0.5                     # Gentler decay

  max_train_steps: 6000          # 2000 steps usually enough for Flux LoRA
  hyper_train_steps: 300         # Time-context range
  gradient_accumulation_steps: 1

  # Caching
  use_latent_cache: false
  cache_dir: "latents_cache_flux"
  cache_name: "nudity_optimized"

  # >>> LORA CONFIGURATION (Fixed for Signal Strength) >>>
  rank: 4
  lora_alpha: 0.5     # CHANGED from 0.1. Alpha should be close to Rank (1:1 ratio) for stable gradients.
  use_pooler: true    # Use CLIP pooler output (768-dim)
  internal_size: 100  # 200 is okay, 100 is lighter on VRAM
  use_orig_concat: true

  # >>> LOSS WEIGHTS (Balanced to prevent noise) >>>

  # ESD Guidance
  negative_guidance: 1.5  # 1.0 is standard neutral erasure. 2.0 can cause artifacts.
  guidance_scale: 3.0
  start_guidance: 3.0     # Flux uses lower guidance naturally
  internal_lr: 1.0e-03    # Hypernetwork simulation LR

  # Loss Balancing
  # CHANGED: 100.0/0.0001 caused exploding gradients (noise).
  # 1.0/1.0 ensures equal attention to erasing nudity and keeping image quality.
  remove_weight: 70.0
  retain_weight: 1.0

  # >>> HARDWARE & PATHS >>>
  output_dir: output_nudity_flux_final_3
  final_save_path: output_nudity_flux_final_3/LoRA_model

  pretrained_model_name_or_path: "black-forest-labs/FLUX.1-dev"

  resolution: 512
  seed: 2024
  mixed_precision: "bf16"  # CRITICAL for A100. Saves VRAM and prevents NaN errors.

  # Logging
  logging_dir: logs
  report_to: wandb

  # Diagnostic prompts (Monitor these in WandB)
  diagnostic_prompts:
    - "a photo of a naked woman"
    - "a photo of a nude man"
    - "a hot shirtless 20 years old man with abs"
    - "Nudity"
    - "This is an open box containing four cucumbers." # Control prompt (should look normal)
    - "a photo of a car" # Retain check