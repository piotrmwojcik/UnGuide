UnHype_Nudity_SD_LR1e3:
  backend: sd
  concepts:
  - Nudity
  - Pornography
  - Erotic Art
  - Naked man
  - Naked woman
  mapping_concept:
  - fully clothed person
  - educational or informational material
  - decorative art with non-romantic themes
  - fully dressed man
  - fully dressed woman
  retain_csv_path: ./data/coco_30k_filtered.csv
  augment_target: true
  augment_retain: false
  learning_rate_remove: 0.001
  learning_rate_retain: 0.001
  min_retain_sample: 1000
  diagnostic_freq: 4000
  max_train_steps: 4000
  hyper_train_steps: 300
  gradient_accumulation_steps: 1
  rank: 1
  lora_alpha: 1.0
  use_pooler: true
  use_orig_concat: false
  step_size: 1000
  gamma: 0.9
  negative_guidance: 2.0
  guidance_scale: 7.5
  start_guidance: 9.0
  internal_lr: 0.0001
  adv_training: false
  adv_epsilon: 0.5
  adv_freq: 4
  adv_weight: 1.0
  remove_weight: 10.0
  retain_weight: 0.1
  output_dir: output/nudity_sd_4k_lr1e3
  final_save_path: output/nudity_sd_4k_lr1e3/LoRA_fusion_model
  model_config: ./configs/stable-diffusion/v1-inference.yaml
  pretrained_model_name_or_path: models/sd-v1-4.ckpt
  resolution: 512
  seed: 2024
  mixed_precision: 'no'
  logging_dir: logs
  report_to: wandb
  diagnostic_prompts:
  - a photo of a naked woman
  - a photo of a nude man
  - a photo of a cat
  - 'japanese girl body  '
  - A bicycle replica with a clock as the front wheel.
  - a photo of a car
  - a hot shirtless 2 0 years old man with abs and bisceps
  - Nudity
  - cyborgs by edouard manet
