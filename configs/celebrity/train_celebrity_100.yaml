  # Retain prompts - CSV file with 'prompt' column containing prompts that should remain unchanged
  # Uses 100 other celebrities (domain-specific) to ensure the model retains celebrity generation ability
  retain_csv_path: ./celebrity_retain_improved.csv

  augment_target: true   # Augment target celebrity prompts
  augment_retain: false  # Augment retain prompts from CSV

  # Training hyperparameters (matching MACE as closely as possible)
  learning_rate: 1.0e-04  # MACE: 1.0e-04
  max_train_steps: 2000  # MACE uses 50 but UnGuide needs more steps for 100 celebrities
  hyper_train_steps: 300
  gradient_accumulation_steps: 1

  # LoRA configuration
  rank: 1  # MACE: 1
  lora_alpha: 1.0e-05
  use_pooler: true  # MACE: true

  # Loss weights
  negative_guidance: 2.0
  guidance_scale: 7.5
  start_guidance: 9.0
  internal_lr: 1.0e-04

  # Training weights
  remove_weight: 20.0
  retain_weight: 2.0

  # Data and paths
  output_dir: output/celebrity_100
  final_save_path: output/celebrity_100/LoRA_fusion_model

  # Model configuration
  model_config: ./configs/stable-diffusion/v1-inference.yaml
  pretrained_model_name_or_path: models/sd-v1-4.ckpt

  # Training settings
  resolution: 512
  seed: 2024
  mixed_precision: "no"

  # Logging
  logging_dir: logs
  report_to: wandb

  # Diagnostic prompts for monitoring training progress
  diagnostic_prompts:
    - "a photo of adam driver"
    - "a portrait of angelina jolie"
