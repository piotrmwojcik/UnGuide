  # Retain prompts (other celebrities to preserve generation ability)
  retain_csv_path: ./data/celebrity_retain_improved.csv

  # Augmentation
  augment_target: true
  augment_retain: false
  celebrity_mode: true

  # Training hyperparameters
  learning_rate_remove: 5.0e-04
  learning_rate_retain: 5.0e-04
  max_train_steps: 6000
  hyper_train_steps: 300
  gradient_accumulation_steps: 1

  # Embedding model: nv_embed (4096-dim)
  embedding_model: nv_embed

  # LoRA configuration
  rank: 6
  lora_alpha: 1.0
  internal_size: 512

  # Loss weights
  negative_guidance: 0.3
  guidance_scale: 7.5
  start_guidance: 9.0
  internal_lr: 1.0e-04

  # Training weights
  remove_weight: 10.0
  retain_weight: 5.0
  retain_steps_per_remove: 20
  retain_batch_size: 1000

  # Paths
  output_dir: output/celebrity_nvembed
  final_save_path: output/celebrity_nvembed/LoRA_fusion_model

  # Model
  model_config: ./configs/stable-diffusion/v1-inference.yaml
  pretrained_model_name_or_path: models/sd-v1-4.ckpt

  # Training settings
  resolution: 512
  seed: 2024
  mixed_precision: "no"

  # Logging
  logging_dir: logs
  report_to: wandb

  # Diagnostic prompts
  diagnostic_prompts:
    - "a photo of adam driver"
    - "a portrait of adriana lima"
    - "amber heard at an event"
    - "amy adams smiling"
    - "andrew garfield acting"
    - "a photo of a person"
    - "a portrait of a person"
    - "a photo of a woman"
    - "a portrait of a woman"
    - "a photo of a man"
    - "a portrait of a man"
