UnHype_Ship:
  # >>> Primary Settings >>>
  backend: sd

  # Target concepts for removal
  concepts:
    - "a ship"
    - "a frigate"
    - "an ocean liner"
    - "a ferry"

  # Mapping concepts - what the target concepts should map to when erased
  mapping_concept:
    - 'a sky'
    - 'a sky'
    - 'a sky'
    - 'a sky'

  # Retain prompts - CSV file with 'prompt' column containing prompts that should remain unchanged
  # Uses CIFAR100 categories to ensure the model doesn't forget other concepts
  retain_csv_path: ./data/cifar100.csv

  augment_target: true   # Augment target concepts to be removed
  augment_retain: false  # Augment retain prompts from CSV

  # Training hyperparameters
  learning_rate_remove: 1.0e-02
  learning_rate_retain: 1.0e-03
  min_retain_sample: 1000
  diagnostic_freq: 200
  max_train_steps: 1000
  hyper_train_steps: 300
  gradient_accumulation_steps: 1

  rank: 1
  lora_alpha: 1.0
  use_pooler: true
  use_orig_concat: false

  step_size: 1000
  gamma: 0.9

  negative_guidance: 2.0
  guidance_scale: 7.5
  start_guidance: 9.0
  internal_lr: 1.0e-04

  remove_weight: 10.0
  retain_weight: 1.0

  output_dir: /net/tscratch/people/plgpiotrwojcik/output/cifar10_ship
  final_save_path: /net/tscratch/people/plgpiotrwojcik/output/cifar10_ship/LoRA_fusion_model

  model_config: ./configs/stable-diffusion/v1-inference.yaml
  pretrained_model_name_or_path: models/sd-v1-4.ckpt

  resolution: 512
  seed: 2024
  mixed_precision: "no"

  logging_dir: logs
  report_to: wandb
  # Training settings
  resolution: 512
  seed: 2024
  mixed_precision: "no"  # None for no mixed precision, or "fp16"/"bf16" for mixed precision

  # Diagnostic prompts for monitoring training progress
  diagnostic_prompts:
    - "a photo of the ship"
    - "a photo of the vessel"
    - "a photo of the boat"
    - "a photo of the watercraft"
    - "a photo of the airplane"
    - "a photo of the automobile"
    - "a photo of the bird"
    - "a photo of the cat"
    - "a photo of the deer"
    - "a photo of the dog"
    - "a photo of the frog"
    - "a photo of the horse"
    - "a photo of the truck"

  # <<< Primary Settings <<<
