UnHype_Airplane:
  # CIFAR-10 airplane unlearning config
  backend: sd

  concepts:
    - "an airplane"
    - "an airliner"
    - "an airship"
    - "a fighter jet"

  mapping_concept:
    - "a ground"
    - "a ground"
    - "a ground"
    - "a ground"

  retain_csv_path: ./data/cifar100.csv

  augment_target: true
  augment_retain: false

  learning_rate_remove: 1.0e-03
  learning_rate_retain: 5.0e-04
  min_retain_sample: 1000
  diagnostic_freq: 200
  max_train_steps: 1000
  hyper_train_steps: 300
  gradient_accumulation_steps: 1

  rank: 1
  lora_alpha: 1.0
  use_pooler: true
  use_orig_concat: false

  step_size: 1000
  gamma: 0.9

  use_huge: true

  negative_guidance: 2.0
  guidance_scale: 7.5
  start_guidance: 9.0
  internal_lr: 1.0e-04

  remove_weight: 10.0
  retain_weight: 1.0

  output_dir: /net/tscratch/people/plgpiotrwojcik/output/cifar10_airplane
  final_save_path: /net/tscratch/people/plgpiotrwojcik/output/cifar10_airplane/LoRA_fusion_model

  model_config: ./configs/stable-diffusion/v1-inference.yaml
  pretrained_model_name_or_path: models/sd-v1-4.ckpt

  resolution: 512
  seed: 2024
  mixed_precision: "no"

  logging_dir: logs
  report_to: wandb

  diagnostic_prompts:
    - "a photo of the airplane"
    - "a photo of the aircraft"
    - "a photo of the plane"
    - "a photo of the jet"
    - "a photo of the automobile"
    - "a photo of the bird"
    - "a photo of the cat"
    - "a photo of the deer"
    - "a photo of the dog"
    - "a photo of the frog"
    - "a photo of the horse"
    - "a photo of the ship"
    - "a photo of the truck"